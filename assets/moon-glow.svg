<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Moon Glow">
  <style>
    .star { animation: twinkle 2.6s ease-in-out infinite; }
    .star2 { animation: twinkle 3.4s ease-in-out infinite; }
    .star3 { animation: twinkle 2.1s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    .moon { animation: floaty 5s ease-in-out infinite; }
    @keyframes floaty { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .shoot { animation: shoot 7s linear infinite; opacity: 0; }
    @keyframes shoot {
      0% { transform: translate(0px, 0px); opacity: 0; }
      8% { opacity: 1; }
      28% { transform: translate(-260px, 130px); opacity: 0; }
      100% { transform: translate(-260px, 130px); opacity: 0; }
    }
  </style>
  <defs>
    <radialGradient id="bgGlow" cx="76%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#0b2a5b" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#071a3a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="#000000"/>
  <rect width="1200" height="400" fill="url(#bgGlow)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle class="star" cx="90" cy="70" r="2.5"/>
    <circle class="star2" cx="210" cy="150" r="1.8"/>
    <circle class="star3" cx="340" cy="60" r="2.2"/>
    <circle class="star" cx="470" cy="120" r="1.6" style="animation-delay:.7s"/>
    <circle class="star2" cx="560" cy="55" r="2.4" style="animation-delay:1.2s"/>
    <circle class="star3" cx="120" cy="260" r="1.7" style="animation-delay:.4s"/>
    <circle class="star" cx="300" cy="300" r="2" style="animation-delay:1.6s"/>
    <circle class="star2" cx="1050" cy="260" r="2.2" style="animation-delay:.9s"/>
    <circle class="star3" cx="1120" cy="90" r="1.8" style="animation-delay:1.4s"/>
    <circle class="star" cx="980" cy="320" r="1.6" style="animation-delay:.2s"/>
  </g>
  <g fill="#93c5fd">
    <circle class="star2" cx="160" cy="180" r="1.5" style="animation-delay:1.1s"/>
    <circle class="star" cx="420" cy="210" r="1.4" style="animation-delay:.5s"/>
    <circle class="star3" cx="650" cy="90" r="1.5" style="animation-delay:1.8s"/>
    <circle class="star" cx="1080" cy="180" r="1.5" style="animation-delay:.8s"/>
  </g>
  <path d="M 4 4 L 10 10 M 10 4 L 4 10" stroke="#60a5fa" stroke-width="1.4" opacity="0.7" transform="translate(240 90)"/>
  <path d="M 4 4 L 10 10 M 10 4 L 4 10" stroke="#60a5fa" stroke-width="1.2" opacity="0.5" transform="translate(1020 300)"/>

  <!-- shooting star -->
  <g class="shoot">
    <line x1="1080" y1="60" x2="1020" y2="90" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1080" cy="60" r="3" fill="#ffffff"/>
  </g>

  <!-- moon -->
  <g class="moon" filter="url(#softGlow)">
    <circle cx="920" cy="130" r="110" fill="url(#moonGlow)"/>
    <circle cx="920" cy="130" r="72" fill="#bfdbfe"/>
    <circle cx="952" cy="130" r="66" fill="#000000" opacity="0.92"/>
    <circle cx="898" cy="108" r="9" fill="#60a5fa" opacity="0.35"/>
    <circle cx="912" cy="148" r="6" fill="#60a5fa" opacity="0.3"/>
    <circle cx="888" cy="142" r="4" fill="#60a5fa" opacity="0.28"/>
  </g>

  <!-- name -->
  <text x="72" y="258" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="800" letter-spacing="16" fill="#ffffff" filter="url(#textGlow)">MӨӨП</text>
  <text x="78" y="308" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="14" fill="#60a5fa">FROM THE DARKSIDE</text>

  <!-- bottom wave -->
  <path d="M0 372 Q 150 352 300 372 T 600 372 T 900 372 T 1200 372 L 1200 400 L 0 400 Z" fill="#0b2a5b" opacity="0.55"/>
  <path d="M0 384 Q 150 368 300 384 T 600 384 T 900 384 T 1200 384 L 1200 400 L 0 400 Z" fill="#1e40af" opacity="0.4"/>
</svg>
